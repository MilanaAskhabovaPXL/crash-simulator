receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlp/openobserve:
    endpoint: openobserve:5081        # Docker service name; gebruik localhost:5081 bij lokale setup
    headers:
      Authorization: "Basic YWRtaW5AZXhhbXBsZS5jb206YWRtaW4xMjM="
      organization: default
      stream-name: default
    tls:
      insecure: true

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlp/openobserve]

  telemetry:
    logs:
      level: warn