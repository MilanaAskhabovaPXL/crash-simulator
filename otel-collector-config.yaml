receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  splunk_hec:
    token: "4a79468a-189f-43c0-adb5-78cbb3254990"
    endpoint: "http://host.docker.internal:8088/services/collector"
    source: "crash-simulator"
    sourcetype: "_json"
    index: "main"

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [splunk_hec]
    metrics:
      receivers: [otlp]
      exporters: [splunk_hec]
    logs:
      receivers: [otlp]
      exporters: [splunk_hec]
